name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Linter
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Construction (types compris)
        run: npm run build
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests navigateur
        run: npm run test:e2e
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-playwright
          path: test-results
          retention-days: 7

  # Publication sur GitHub Pages (https://al00ss.github.io/song-audio/), seulement si tous les
  # tests passent et seulement depuis la branche main.
  publication:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construction pour /song-audio/
        run: npm run build
        env:
          BASE_PUBLIC: /song-audio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploiement
        uses: actions/deploy-pages@v4
