name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Linter
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Construction (types compris)
        run: npm run build
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests navigateur
        run: npm run test:e2e
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-playwright
          path: test-results
          retention-days: 7
